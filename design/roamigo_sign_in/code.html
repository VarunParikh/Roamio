  </head><body class="bg-surface font-body text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-16 px-4 flex items-center justify-between"><button aria-label="Go Back" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface bg-surface-container-low hover:bg-surface-container transition-colors active:scale-95" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><span class="text-sm font-headline font-bold tracking-tight uppercase text-on-surface truncate px-2">Email Sign In</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full px-5 py-6 space-y-6">
<!-- Top Visual Badge & Welcome Sub-Header -->
<div class="flex items-center justify-between pt-1">
<div class="flex items-center space-x-2">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-tertiary-fixed text-[18px]">explore</span>
</div>
<span class="font-headline font-extrabold text-lg tracking-tight text-on-surface">roamigo<span class="text-secondary">.</span></span>
</div>
<span class="px-3.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-label text-xs font-semibold tracking-wide uppercase shadow-sm">
      Sign In
    </span>
</div>
<!-- Hero Headline Section -->
<div class="space-y-1.5 pt-2">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-tertiary-fixed/20 text-on-surface text-xs font-label font-bold mb-1">
<span class="w-2 h-2 rounded-full bg-tertiary-fixed animate-ping"></span>
      Ready for take-off
    </div>
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface leading-tight">
      Welcome back,<br/>explorer <span class="inline-block hover:rotate-12 transition-transform cursor-pointer">👋</span>
</h1>
<p class="font-body text-sm text-on-surface-variant leading-relaxed">
      Pick up right where your last itinerary left off.
    </p>
</div>
<!-- Quick Social Auth Stack -->
<div class="grid grid-cols-2 gap-3 pt-1">
<button class="flex items-center justify-center gap-2.5 py-3.5 px-4 rounded-full bg-surface-container-lowest text-on-surface shadow-sm active:scale-95 transition-all hover:bg-surface-container-low group" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-label text-xs font-bold tracking-tight">Google</span>
</button>
<button class="flex items-center justify-center gap-2.5 py-3.5 px-4 rounded-full bg-surface-container-lowest text-on-surface shadow-sm active:scale-95 transition-all hover:bg-surface-container-low" type="button">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.87c.66-.8 1.11-1.92.99-3.04-1 .04-2.16.67-2.83 1.46-.58.67-1.1 1.77-.96 2.88 1.11.09 2.14-.5 2.8-1.3"></path>
</svg>
<span class="font-label text-xs font-bold tracking-tight">Apple</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center justify-center py-1">
<div class="w-full h-px bg-surface-variant"></div>
<span class="absolute bg-surface px-4 font-label text-xs uppercase tracking-wider text-on-surface-variant/80">
      or email
    </span>
</div>
<!-- Form Inputs Container -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block font-label text-xs font-bold uppercase tracking-wider text-on-surface px-1">
        Account Email or Handle
      </label>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>
</div>
<input class="w-full bg-surface-container-lowest text-on-surface font-body text-sm font-medium rounded-[24px] pl-11 pr-4 py-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-secondary/40 transition-all placeholder:text-outline-variant" placeholder="yourname@domain.com" type="text" value="ari@wanderlust.com"/>
<div class="absolute right-4">
<span class="material-symbols-outlined text-secondary text-[20px]">check_circle</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex items-center justify-between px-1">
<label class="block font-label text-xs font-bold uppercase tracking-wider text-on-surface">
          Password
        </label>
<button class="font-label text-xs font-bold text-secondary hover:text-secondary-container transition-colors" type="button">
          Forgot?
        </button>
</div>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-lowest text-on-surface font-body text-sm font-medium rounded-[24px] pl-11 pr-12 py-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-secondary/40 transition-all" id="passwordInput" placeholder="••••••••••••" type="password" value="safepassword123"/>
<button aria-label="Toggle password visibility" class="absolute right-4 text-on-surface-variant hover:text-on-surface transition-colors p-1" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Stay Synced / Remember Device Strip -->
<div class="flex items-center justify-between p-3.5 rounded-[20px] bg-surface-container-low shadow-sm">
<label class="flex items-center space-x-3 cursor-pointer select-none">
<input checked="" class="w-4 h-4 accent-primary rounded-md cursor-pointer" type="checkbox"/>
<span class="font-label text-xs font-semibold text-on-surface">Remember this phone</span>
</label>
<div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label text-[11px] font-extrabold shadow-sm">
<span>⚡</span>
<span>Auto-sync</span>
</div>
</div>
<!-- Main Sign In Button (Neo-Wasabi Punch) -->
<button class="w-full py-4 px-6 rounded-full bg-tertiary-fixed hover:bg-tertiary-fixed-dim text-on-tertiary-fixed font-headline font-extrabold text-base tracking-tight shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Sign In to Roamigo</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Biometric FaceID Trigger -->
<div class="flex flex-col items-center justify-center pt-1">
<button class="flex items-center gap-2.5 px-5 py-2.5 rounded-full bg-surface-container-lowest hover:bg-surface-container text-on-surface shadow-sm active:scale-95 transition-all" id="faceIdBtn" type="button">
<span class="material-symbols-outlined text-[18px] text-secondary">face</span>
<span class="font-label text-xs font-bold">Quick Face ID Login</span>
</button>
</div>
<!-- Bottom Squad Promotion & Sign Up Link -->
<div class="pt-4 pb-2 text-center">
<div class="p-4 rounded-3xl bg-surface-container-lowest shadow-sm flex flex-col items-center space-y-2">
<div class="flex -space-x-2 overflow-hidden py-1">
<div class="w-7 h-7 rounded-full bg-secondary text-on-secondary flex items-center justify-center font-bold text-[10px] ring-2 ring-surface-container-lowest">
          ML
        </div>
<div class="w-7 h-7 rounded-full bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center font-bold text-[10px] ring-2 ring-surface-container-lowest">
          SK
        </div>
<div class="w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-[10px] ring-2 ring-surface-container-lowest">
          +4
        </div>
</div>
<p class="font-body text-xs text-on-surface-variant">
        New to planning group trips together?
      </p>
<a class="inline-flex items-center gap-1 font-label text-xs font-extrabold text-on-surface hover:text-secondary transition-colors underline underline-offset-4 decoration-tertiary-fixed decoration-2" href="#register">
        Create a Squad Account →
      </a>
</div>
</div>
</div>
<script>
  (function initSignInInteractivity() {
    const pwdInput = document.getElementById('passwordInput');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdIcon = document.getElementById('passwordIcon');
    const faceIdBtn = document.getElementById('faceIdBtn');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (faceIdBtn) {
      faceIdBtn.addEventListener('click', () => {
        const originalText = faceIdBtn.innerHTML;
        faceIdBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px] text-secondary animate-spin">sync</span>
          <span class="font-label text-xs font-bold">Verifying Biometrics...</span>
        `;
        setTimeout(() => {
          faceIdBtn.innerHTML = `
            <span class="material-symbols-outlined text-[18px] text-on-tertiary-container">check_circle</span>
            <span class="font-label text-xs font-bold text-on-surface">Verified! Launching...</span>
          `;
          setTimeout(() => {
            faceIdBtn.innerHTML = originalText;
          }, 1500);
        }, 1000);
      });
    }
  })();
</script></main></body></html>
