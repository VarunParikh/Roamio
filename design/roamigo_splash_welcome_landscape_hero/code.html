</head><body class="font-body text-white antialiased flex flex-col min-h-screen relative overflow-x-hidden selection:bg-tertiary-fixed selection:text-black"><main class="flex-1 flex flex-col relative w-full min-h-screen pt-safe pb-safe overflow-hidden">
<!-- Full-Bleed Travel Landscape Photography -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<img alt="Dramatic coastal cliffs travel landscape" class="w-full h-full object-cover object-center scale-105 transform motion-safe:animate-pulse transition-transform duration-1000" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7bKcQfz0WWVIqH2Z3jnSgnkQNJcswq_dvZCMb3jaVSTP3BGEmJZto5koBpCChXGGgcIq-ZUkclacVNLql1Jatt-gEEkCsnPQJwbD850wVIEWzsFydVK704HbzPZ2s-JuEKGhthzdHmJS8hTFZd0j9Z7k273mDE2Sps_A0G26e4ARs6jRErnDYj8Sds_cAIskB0WRltqvFHujvFr3GUbZH_GEIGnGwqObmq83YS48">
<!-- Multi-stop Dark Cinematic Gradient for crystal-clear readability -->
<div class="absolute inset-0 bg-gradient-to-b from-[#0f1115]/60 via-[#0f1115]/40 to-[#0f1115]/95 backdrop-blur-[0.5px]"></div>
</div>
<div class="flex flex-col flex-1 w-full px-5 py-3 space-y-4 overflow-hidden relative z-10 justify-between">
<!-- Top Status Indicator & Live Sync Badge -->
<div class="flex items-center justify-between w-full pt-1">


</div>
<!-- Wordmark & Editorial Brand Masthead -->
<div class="flex flex-col items-center text-center pt-1 pb-0">
<div class="relative inline-flex items-center">
<span class="font-display font-extrabold text-5xl tracking-tighter text-white drop-shadow-md">roamigo</span>
<span class="w-3.5 h-3.5 ml-1 rounded-full bg-tertiary-fixed shadow-lg shadow-tertiary-fixed/40"></span>
<span class="absolute -top-2 -right-8 px-2.5 py-0.5 rounded-full bg-secondary text-white text-[10px] font-black tracking-widest uppercase rotate-6 shadow-md border border-white/20">beta</span>
</div>
<p class="mt-1 text-[11px] font-bold tracking-widest text-white/70 uppercase">The Nomadic Ledger</p>
</div>
<!-- Interactive Graphic Centerpiece (Visual Hero Stack Floating Over Landscape) -->

<!-- Tagline & Narrative Framing -->
<div class="text-center px-4 pt-1 space-y-1.5">
<h2 class="font-display font-extrabold text-2xl tracking-tight text-white drop-shadow-md">
      Split bills, <span class="text-white underline decoration-tertiary-fixed decoration-4 underline-offset-4">not friendships</span>.
    </h2>
<p class="text-xs text-white/80 leading-relaxed max-w-xs mx-auto drop-shadow-sm font-medium">
      Instant peer splits, and zero awkward math.
    </p>
</div>
<!-- Primary Interactive Call to Action Stack -->
<div class="flex flex-col w-full space-y-2.5 pt-1">
<button class="w-full h-14 rounded-full bg-tertiary-fixed hover:bg-tertiary-fixed-dim active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 text-black font-headline font-black text-base shadow-xl shadow-tertiary-fixed/25 cursor-pointer border border-tertiary-fixed/50" id="get-started-btn">
<span class="">Join the Squad</span>
<span class="material-symbols-outlined text-xl font-bold">arrow_forward</span>
</button>
<button class="w-full h-12 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 active:scale-[0.99] transition-all duration-200 flex items-center justify-center text-white font-headline font-semibold text-sm cursor-pointer shadow-md" id="sign-in-btn">
      I already have an account
</button>
</div>
<!-- Feature Snapshot Micro-Grid (Translucent Glass Style) -->
<div class="grid grid-cols-3 gap-2 pt-0.5">
<div class="p-2.5 rounded-2xl bg-black/45 backdrop-blur-md border border-white/10 text-center flex flex-col items-center shadow-lg">
<span class="material-symbols-outlined text-tertiary-fixed text-lg mb-0.5">wifi_off</span>
<span class="text-[11px] font-bold text-white">Offline Mode</span>

</div>
<div class="p-2.5 rounded-2xl bg-black/45 backdrop-blur-md border border-white/10 text-center flex flex-col items-center shadow-lg">
<span class="material-symbols-outlined text-tertiary-fixed text-lg mb-0.5">qr_code_scanner</span>
<span class="text-[11px] font-bold text-white">Snap Receipt</span>

</div>
<div class="p-2.5 rounded-2xl bg-black/45 backdrop-blur-md border border-white/10 text-center flex flex-col items-center shadow-lg">
<span class="material-symbols-outlined text-tertiary-fixed text-lg mb-0.5">bolt</span>
<span class="text-[11px] font-bold text-white">1-Tap Settle</span>

</div>
</div>
<!-- Minimalist Legal & Status Footer -->

</div>
<script>
  // Micro-interaction: playful sticker bouncers on tap/click
  const stickerIds = ['sticker-1', 'sticker-2', 'sticker-3', 'sticker-4'];
  stickerIds.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', () => {
      el.style.transform = 'scale(1.15) rotate(' + (Math.random() * 16 - 8) + 'deg)';
      setTimeout(() => {
        el.style.transform = '';
      }, 250);
    });
  });

  // Haptic feedback illusion on primary CTA
  const getStartedBtn = document.getElementById('get-started-btn');
  if (getStartedBtn) {
    getStartedBtn.addEventListener('click', () => {
      getStartedBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span><span>Setting up Passport...</span>';
      setTimeout(() => {
        getStartedBtn.innerHTML = '<span>Welcome Aboard ✨</span><span class="material-symbols-outlined text-xl">check</span>';
      }, 1000);
    });
  }
</script></main>

</body></html>
