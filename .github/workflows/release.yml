name: Release

# Pushing a tag like v1.2.3 builds a signed prod APK and publishes a GitHub
# Release with it. v1.2.3-rc1 makes a pre-release, which the in-app update
# popup ignores. Steps for the owner: docs/RELEASING.md.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; only the publish job may write (the Release).
permissions:
  contents: read

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-latest
    # Waits for the owner's approval in the "release" environment, whose
    # secrets (signing key, prod config) only this job can read.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read pinned Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get

      - name: Check the tag matches pubspec.yaml
        id: version
        run: dart run tool/release_check.dart check "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      - name: Add Firebase config and upload key from secrets
        env:
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for name in GOOGLE_SERVICES_JSON_PROD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is missing. See docs/RELEASING.md."
              exit 1
            fi
          done
          mkdir -p android/app/src/prod
          printf '%s' "$GOOGLE_SERVICES_JSON_PROD" > android/app/src/prod/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ROAMIO_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed prod APK
        env:
          ROAMIO_REQUIRE_SIGNING: 'true'
          ROAMIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --flavor prod --release

      - name: Check the APK is signed with the upload key
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=build/app/outputs/flutter-apk/app-prod-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "::error::The APK is signed with a debug key, not the upload key."
            exit 1
          fi
          out="$RUNNER_TEMP/Roamio-$GITHUB_REF_NAME.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dart run tool/release_check.dart notes "$VERSION" > "$RUNNER_TEMP/notes.md"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/src/prod/google-services.json

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "Roamio $GITHUB_REF_NAME")
          if [ -s release/notes.md ]; then
            args+=(--notes-file release/notes.md)
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" "release/Roamio-$GITHUB_REF_NAME.apk" "${args[@]}"
